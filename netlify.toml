[build]
  # There's no package.json at the repo root, so Netlify's automatic
  # dependency install never runs — install explicitly for both frontend
  # (needed for the build itself) and backend (needed so the function
  # bundler can resolve its node_modules).
  command = "cd frontend && npm install && npm run build && cd ../backend && npm install"
  publish = "frontend/dist"

# Netlify's build image sets NODE_ENV=production during npm install, which
# makes npm skip devDependencies (tsc, vite, etc. all live there). This
# forces them to be installed anyway so the frontend build script works.
[build.environment]
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"

# Frontend calls /api/waterbodies, /api/weather, /api/health (see
# frontend/src/lib/api.ts, VITE_API_BASE_URL defaults to "/api"). The
# Express app (backend/src/app.ts) still expects the "/api" prefix on its
# routes too — so the target keeps a second "/api" segment: Netlify strips
# only the "/.netlify/functions/api" part before invoking the function,
# and the rest of the path (still starting with "/api/...") reaches
# Express unchanged, matching its routes with zero code differences
# between local dev and the deployed function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Single-page app fallback (safe to keep even though the app currently
# has no client-side routes beyond "/").
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
